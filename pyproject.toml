[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalscope-platform"
version = "0.1.0"
description = "Reproducible LLM evaluation, observability, and release gates"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<2.1", "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3", "httpx>=0.28,<1", "PyYAML>=6,<7",
  "redis>=5,<7", "alembic>=1.14,<2",
  "opentelemetry-sdk>=1.29,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
  "prometheus-client>=0.21,<1",
  "cryptography>=46,<51",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
evalscope = "cli.main:main"

[tool.setuptools.packages.find]
include = ["backend*", "cli*", "evalscope_sdk*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.black]
target-version = ["py311"]
