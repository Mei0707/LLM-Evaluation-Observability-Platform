global:
  scrape_interval: 10s
scrape_configs:
  - job_name: evalscope-api
    static_configs:
      - targets: [api:8000]
    # When enabling API authentication, configure authorization.credentials_file
    # with a read-only Docker secret containing EVALSCOPE_API_TOKEN.
  - job_name: evalscope-worker
    static_configs:
      - targets: [worker:9001]
