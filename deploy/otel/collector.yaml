receivers:
  otlp:
    protocols:
      http: {endpoint: "0.0.0.0:4318"}
processors:
  batch: {}
exporters:
  otlphttp/jaeger:
    endpoint: http://jaeger:4318
    tls: {insecure: true}
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/jaeger]
